<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Mimir architecture: You sign off. The Executive Command Layer manifesto cascades objectives to specialist agent teams, which run on a deterministic runtime, all made visible in the Mimir Console.">
  <defs>
    <radialGradient id="glow" cx="15%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#6f92ff" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#6f92ff" stop-opacity="0"/>
    </radialGradient>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="4.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5b6472"/>
    </marker>
    <marker id="arwd" markerWidth="9" markerHeight="9" refX="4.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6f92ff"/>
    </marker>
  </defs>

  <!-- backdrop -->
  <rect x="1" y="1" width="878" height="558" rx="16" fill="#0e1117" stroke="#262d38"/>
  <rect x="1" y="1" width="878" height="558" rx="16" fill="url(#glow)"/>

  <!-- ===== connectors (drawn first, under nodes) ===== -->
  <g stroke="#4d5561" stroke-width="1.6" fill="none">
    <!-- YOU -> ECL -->
    <line x1="440" y1="92" x2="440" y2="116" marker-end="url(#arw)"/>
    <!-- ECL -> distribution bus -->
    <line x1="440" y1="198" x2="440" y2="232"/>
    <line x1="128" y1="232" x2="632" y2="232"/>
    <line x1="128" y1="232" x2="128" y2="250" marker-end="url(#arw)"/>
    <line x1="336" y1="232" x2="336" y2="250" marker-end="url(#arw)"/>
    <line x1="544" y1="232" x2="544" y2="250" marker-end="url(#arw)"/>
    <!-- teams -> convergence bus -->
    <line x1="128" y1="340" x2="128" y2="366"/>
    <line x1="336" y1="340" x2="336" y2="366"/>
    <line x1="544" y1="340" x2="544" y2="366"/>
    <line x1="128" y1="366" x2="544" y2="366"/>
    <line x1="440" y1="366" x2="440" y2="388" marker-end="url(#arw)"/>
    <!-- runtime -> console -->
    <line x1="440" y1="442" x2="440" y2="466" marker-end="url(#arw)"/>
  </g>
  <!-- Genesis (conditional) connectors, dashed accent -->
  <g stroke="#6f92ff" stroke-width="1.5" fill="none" stroke-dasharray="4 4" opacity="0.85">
    <line x1="632" y1="232" x2="752" y2="232"/>
    <line x1="752" y1="232" x2="752" y2="250" marker-end="url(#arwd)"/>
    <line x1="752" y1="340" x2="752" y2="404"/>
    <line x1="752" y1="404" x2="742" y2="404" marker-end="url(#arwd)"/>
  </g>

  <!-- connector labels -->
  <text x="452" y="218" fill="#6f7784" font-size="11" font-style="italic">cascades objectives</text>

  <!-- ===== YOU ===== -->
  <rect x="330" y="36" width="220" height="56" rx="12" fill="#1a2238" stroke="#6f92ff" stroke-width="1.6"/>
  <text x="440" y="61" text-anchor="middle" fill="#e8ebf0" font-size="19" font-weight="700" letter-spacing="1">YOU</text>
  <text x="440" y="79" text-anchor="middle" fill="#a8b0bd" font-size="10.5">sign-offs · gates · sole authority</text>

  <!-- ===== Executive Command Layer ===== -->
  <text x="740" y="112" text-anchor="end" fill="#6f92ff" font-size="10.5" font-style="italic">the interview builds this  ↓</text>
  <rect x="140" y="116" width="600" height="82" rx="12" fill="#171c25" stroke="#6f92ff" stroke-width="2"/>
  <text x="440" y="146" text-anchor="middle" fill="#8aa4ff" font-size="16" font-weight="700" letter-spacing="0.6">EXECUTIVE COMMAND LAYER</text>
  <text x="440" y="167" text-anchor="middle" fill="#e8ebf0" font-size="12">the manifesto — your strategy, versioned &amp; machine-readable</text>
  <text x="440" y="185" text-anchor="middle" fill="#a8b0bd" font-size="11">North Star · 9 business domains · evidence locker</text>

  <!-- ===== team cards ===== -->
  <!-- SEO -->
  <rect x="40" y="250" width="176" height="90" rx="11" fill="#171c25" stroke="#262d38"/>
  <text x="128" y="284" text-anchor="middle" fill="#e8ebf0" font-size="13.5" font-weight="600">SEO / AEO / GEO</text>
  <rect x="90" y="298" width="76" height="22" rx="11" fill="#12271d" stroke="#2f6b4c"/>
  <text x="128" y="313" text-anchor="middle" fill="#4ecb8a" font-size="11" font-weight="600">12 agents</text>

  <!-- App Delivery -->
  <rect x="248" y="250" width="176" height="90" rx="11" fill="#171c25" stroke="#262d38"/>
  <text x="336" y="284" text-anchor="middle" fill="#e8ebf0" font-size="13.5" font-weight="600">App Delivery</text>
  <rect x="298" y="298" width="76" height="22" rx="11" fill="#12271d" stroke="#2f6b4c"/>
  <text x="336" y="313" text-anchor="middle" fill="#4ecb8a" font-size="11" font-weight="600">13 agents</text>

  <!-- Content & Brand -->
  <rect x="456" y="250" width="176" height="90" rx="11" fill="#171c25" stroke="#262d38"/>
  <text x="544" y="284" text-anchor="middle" fill="#e8ebf0" font-size="13.5" font-weight="600">Content &amp; Brand</text>
  <text x="544" y="308" text-anchor="middle" fill="#a8b0bd" font-size="11">+ brand steward</text>
  <text x="544" y="324" text-anchor="middle" fill="#6f7784" font-size="10">gate-checks every asset</text>

  <!-- Genesis (conditional) -->
  <rect x="664" y="250" width="176" height="90" rx="11" fill="#141a2a" stroke="#6f92ff" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="752" y="284" text-anchor="middle" fill="#8aa4ff" font-size="13.5" font-weight="600">New teams</text>
  <text x="752" y="308" text-anchor="middle" fill="#a8b0bd" font-size="11">born on demand</text>
  <text x="752" y="324" text-anchor="middle" fill="#6f7784" font-size="10">via Genesis Protocol</text>

  <!-- ===== Deterministic Runtime ===== -->
  <rect x="140" y="388" width="600" height="54" rx="11" fill="#171c25" stroke="#3a4250"/>
  <text x="440" y="412" text-anchor="middle" fill="#e8ebf0" font-size="14" font-weight="700" letter-spacing="0.6">DETERMINISTIC RUNTIME</text>
  <text x="440" y="430" text-anchor="middle" fill="#a8b0bd" font-size="11">heartbeats · gates · budgets · ledgers</text>

  <!-- ===== Mimir Console ===== -->
  <rect x="140" y="466" width="600" height="58" rx="11" fill="#1a2238" stroke="#6f92ff" stroke-width="1.8"/>
  <text x="440" y="492" text-anchor="middle" fill="#8aa4ff" font-size="15" font-weight="700" letter-spacing="0.6">MIMIR CONSOLE</text>
  <text x="440" y="511" text-anchor="middle" fill="#cdd4e0" font-size="11.5">everything visible · every decision yours</text>
</svg>
