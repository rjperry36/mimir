business_id: "riverside-bookings"
engagement: "roster-appdev / brownfield website-booking-app rebuild (ECL 3.6)"
updated: "2026-07-03"

risks:
  - id: R1
    description: >
      Repo access to the owner's booking-app repository is not yet confirmed.
      The repo assessment (M3, first technical deliverable per cascade) cannot
      start without it — blocks Wave 4 and everything after.
    likelihood: med
    impact: high
    mitigation: >
      Credentials request already recorded as a named human dependency
      (pre-flight section 4, credentials-template.yaml). Track as D1; escalate
      per critical sign-off timeout (24h) once Wave 3 nears completion.
    owner: "delivery_project_manager_agent (escalation: the owner via orchestrator)"
    status: open
  - id: R2
    description: >
      The booking provider's API capabilities are unverified — live
      availability, booking-confirmation trigger data, and the GAP-025
      repeat-customer extract all assume the API supports them. If it does not,
      core scope items need redesign (embed-only fallback is a product
      decision, not a PM one).
    likelihood: med
    impact: high
    mitigation: >
      Verify API capabilities during Wave 4 architecture (Agent 04) before any
      engineering wave fires (principle D1). Any shortfall routed to
      orchestrator/owner as scope decision.
    owner: architecture_solution_design_agent
    status: open
  - id: R3
    description: >
      GAP-001 (committed dynamic pricing) blocks any repricing go-live and any
      booking-engine repricing reconfiguration. Pricing is an owner exclusion
      zone. Risk: repricing expectations leak into build scope.
    likelihood: low
    impact: high
    mitigation: >
      Plan explicitly excludes pricing reconfiguration (delivery plan sections
      1 and 3C). Any pricing-touching request = immediate hold +
      scope_change_record + owner sign-off. Does not block the build itself
      (cascade, sign-off section).
    owner: delivery_project_manager_agent
    status: open
  - id: R4
    description: >
      Gate integration contract is undocumented: a QR-code gate device
      validates booking references against the booking database — a confirmed
      REAL integration the rebuilt app must serve or preserve (cascade change
      2). No interface spec (DB shape, query path, device protocol) exists in
      agent-visible context. Breaking it strands customers at the gate.
    likelihood: med
    impact: high
    mitigation: >
      Documenting the integration contract is a named M4 exit criterion (Agent
      04) before database work (M6) starts; verification against the contract
      is a go-live checklist item (3A).
    owner: architecture_solution_design_agent
    status: open
  - id: R5
    description: >
      Single-owner decision bottleneck: the owner is the sole sign-off for all
      exclusion zones, credentials, GAP-001/012/024/025 decisions, and the go
      decision (ECL card; pre-flight section 4). Owner unavailability stalls
      multiple waves at once.
    likelihood: med
    impact: med
    mitigation: >
      Batch owner decisions into the per-wave client pack; give advance notice
      of upcoming decision points (GAP-024 at Wave 3, GAP-012 + credentials at
      Wave 4); apply AOM timeout classes and escalate per the cascade
      acknowledgement protocol. Co-founder counter-signature outstanding
      (GAP-028) — no confirmed second signatory.
    owner: delivery_project_manager_agent
    status: open
  - id: R6
    description: >
      Test-double-to-production migration risk: the pilot runs the hosting
      platform, database, auth provider and email provider in declared
      test-double mode with a locally-run pipeline (engagement pilot note).
      Behaviour verified against doubles may not hold against real services
      (auth flows, email deliverability, DB behaviour, deploy environment), and
      the QA/UX/security sign-offs must remain valid in the production
      configuration.
    likelihood: med
    impact: high
    mitigation: >
      Milestone M9b requires migration complete AND re-verification in the
      production configuration before the go decision; go-live checklist 3C
      makes it blocking. Sign-off agents confirm validity post-migration.
    owner: "devops_repo_cicd_agent (coordination: roster_appdev_orchestrator_agent)"
    status: open
  - id: R7
    description: >
      No engagement budget envelope is stated in the ECL (pre-flight section 1
      — only the ad-spend baseline is recorded, which is not a build budget).
      The PM cannot cost-control or assess budget impact of changes; any new
      spend (SaaS tiers at production migration, tooling) is an owner
      exclusion-zone commitment.
    likelihood: high
    impact: med
    mitigation: >
      No budget figure invented (non-fabrication gate). Flag to orchestrator
      for owner decision on whether an envelope will be set. Until then, every
      spend-bearing item routes to owner sign-off individually.
    owner: "delivery_project_manager_agent (decision: the owner via orchestrator)"
    status: open
  - id: R8
    description: >
      Live-trading cutover risk: the booking site is the sole revenue channel;
      any booking/payment outage during cutover = MAJOR immediate owner
      escalation (cascade must-not-do). Brownfield cutovers on live channels
      are the highest-exposure step of the plan.
    likelihood: med
    impact: high
    mitigation: >
      Cutover is an explicit milestone (M9b) owned by devops_repo_cicd_agent,
      fired only after all Wave 9 sign-offs; cutover-safety items are blocking
      go-live checklist entries (3C). Escalation path pre-agreed in the
      communication cadence.
    owner: devops_repo_cicd_agent
    status: open
  - id: R9
    description: >
      Brownfield unknown: the existing in-development repo may be assessed as
      unfit to extend (contemplated by pre-flight, Agent 04 row), triggering a
      MAJOR owner decision and a re-plan of Waves 5-9 effort.
    likelihood: med
    impact: med
    mitigation: >
      Repo assessment is deliberately sequenced first (M3) so the finding
      lands before any engineering investment; a re-plan would be handled via
      scope_change_record to the orchestrator.
    owner: architecture_solution_design_agent
    status: open

